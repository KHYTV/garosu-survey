# Supabase 무료 프로젝트는 7일 동안 요청이 없으면 일시정지된다.
# 매일 한 번 공개 키로 가벼운 조회를 보내 깨어 있게 한다(우리동네가로수 앱과 설문이 같은 프로젝트를 쓴다).
# 프로젝트가 멈춰 있으면 이 작업이 실패해 GitHub가 메일로 알려 준다 → 대시보드에서 Restore project.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://clegtsntgwitpqpfnhob.supabase.co
      SUPABASE_KEY: sb_publishable_X0PsntbEoDODj9LLRZi1-Q_D2tCrjwS   # 공개 키(브라우저에도 들어 있는 값)
    steps:
      - name: 설문 세션 조회 함수 호출 (DB 쿼리 1회)
        run: |
          code=$(curl -s -o /tmp/r1 -w "%{http_code}" -X POST \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}' "$SUPABASE_URL/rest/v1/rpc/gs_session_info")
          echo "gs_session_info → HTTP $code"; cat /tmp/r1; echo
          echo "code1=$code" >> "$GITHUB_ENV"
      - name: 우리동네가로수 활동 목록 조회 (예비)
        run: |
          code=$(curl -s -o /tmp/r2 -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/activity_catalog?select=id&limit=1")
          echo "activity_catalog → HTTP $code"; cat /tmp/r2; echo
          echo "code2=$code" >> "$GITHUB_ENV"
      - name: 판정
        run: |
          # 둘 중 하나라도 2xx면 프로젝트가 깨어 있는 것. 함수가 아직 없으면(404) 다른 쪽으로 판단한다
          if [[ "$code1" =~ ^2 ]] || [[ "$code2" =~ ^2 ]]; then
            echo "Supabase 프로젝트가 살아 있습니다."
          else
            echo "::error::Supabase 프로젝트에 닿지 못했습니다(HTTP $code1 / $code2). 일시정지됐다면 대시보드에서 Restore project 를 누르세요."
            exit 1
          fi
